<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Contact Jennith through the portfolio website."
  >

  <title>Contact | Jennith</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <a href="#main-content" class="skip-link">
    Skip to Main Content
  </a>

  <header>
    <div class="container header-flex">

      <h1 class="logo">Jennith</h1>

      <nav aria-label="Main Navigation">
        <ul>

          <li>
            <a href="index.html">
              Home
            </a>
          </li>

          <li>
            <a href="projects.html">
              Projects
            </a>
          </li>

          <li>
            <a
              href="contact.html"
              class="active"
              aria-current="page"
            >
              Contact
            </a>
          </li>

        </ul>
      </nav>

    </div>
  </header>

  <main id="main-content">

    <section>
      <div class="container">

        <h2 class="section-title">
          Contact Me
        </h2>

        <form aria-label="Contact Form">

          <div class="form-group">

            <label for="name">
              Full Name
            </label>

            <input
              type="text"
              id="name"
              name="name"
              required
              autocomplete="name"
            >

          </div>

          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
            >

          </div>

          <div class="form-group">

            <label for="message">
              Message
            </label>

            <textarea
              id="message"
              name="message"
              rows="6"
              required
            ></textarea>

          </div>

          <button type="submit" class="btn">
            Send Message
          </button>

        </form>

      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <p>© 2026 Jennith. All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
